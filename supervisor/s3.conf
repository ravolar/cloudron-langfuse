[program:s3]
priority=10
directory=/app/data/s3
; S3 on all interfaces: Cloudron's proxy reaches it for the public media subdomain (presigned URLs
; into a private bucket). Objects are files under buckets/, their metadata under meta/ (no xattrs,
; so Cloudron's file backup keeps it). One gateway process, so object locks stay in memory instead of
; lock files next to the objects.
command=/app/pkg/app-env.sh --service /usr/local/bin/versitygw --port :9100 --quiet posix --sidecar /app/data/s3/meta --object-lock-mode local /app/data/s3/buckets
user=cloudron
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
