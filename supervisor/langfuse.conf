; Cloudron stops containers with a 10 s grace period and supervisor stops the programs in reverse
; priority order (web, worker, then ClickHouse and the S3 server), so their stopwaitsecs add up to
; less than that. Interrupted worker jobs are retried from the queue.
[program:clickhouse]
priority=10
directory=/var/lib/clickhouse
command=/app/pkg/app-env.sh --service env CLICKHOUSE_WATCHDOG_ENABLE=0 /usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml
user=cloudron
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
priority=20
directory=/app/code/worker
command=/app/pkg/app-env.sh /app/pkg/worker.sh
user=cloudron
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
priority=30
directory=/app/code/web
command=/app/pkg/app-env.sh /app/pkg/web.sh
user=cloudron
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:retention]
priority=40
directory=/app/data/s3
command=/app/pkg/app-env.sh /app/pkg/retention.sh
user=cloudron
autostart=true
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
