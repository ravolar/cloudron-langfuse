; Cloudron stops containers with a short grace period; supervisor stops the programs in reverse
; priority order (web, worker, then the stores).
[program:clickhouse]
priority=10
directory=/var/lib/clickhouse
command=/app/pkg/app-env.sh --service env CLICKHOUSE_WATCHDOG_ENABLE=0 /usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml
user=cloudron
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
priority=20
directory=/app/code/worker
command=/app/pkg/app-env.sh /app/pkg/worker.sh
user=cloudron
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
priority=30
directory=/app/code/web
command=/app/pkg/app-env.sh /app/pkg/web.sh
user=cloudron
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
